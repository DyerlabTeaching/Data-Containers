title: Dyerlab Branding
author: Rodney Dyer
version: 2.0.0
quarto-required: ">=1.6.0"
# Formats:
#   dyerlab-html      homework, in-class, log — self-contained, with code-tools
#                     so students can grab the source of the document.
#   dyerlab-revealjs  slides.
# The narrative uses a separate extension (../dyerlab-narrative) so books can
# reuse and override it. Shared SCSS/assets live one level up (repo root).
contributes:
  formats:
    common:
      highlight-style: arrow
      code-overflow: wrap
      format-links: false
    html:
      theme: [../current-theme.scss, ../dyerlab-html.scss]
      toc: true
      toc-title: Contents
      toc-location: right
      html-math-method: katex
      code-block-border-left: "#5BBCD6"
      citations-hover: true
      footnotes-hover: true
      link-external-icon: true
      embed-resources: true
      code-tools: true
    revealjs:
      resources:
        - ../assets/contour.png
      title-slide-attributes:
        data-background-image: "_extensions/dyerlab/assets/contour.png"
        data-background-position: "right"
        data-background-size: "initial"
      theme: [../current-theme.scss, ../dyerlab-revealjs.scss]
      embed-resources: true
      code-fold: false
      footer: "[Dyerlab](https://rodneydyer.com)"
      transition: fade
      background-transition: fade
      slide-number: true
      show-slide-number: speaker
