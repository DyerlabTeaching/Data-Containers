title: Dyerlab Narrative
author: Rodney Dyer
version: 2.0.0
quarto-required: ">=1.6.0"
# Formats:
#   dyerlab-narrative-html  a module's narrative.qmd, and the HTML edition of any
#                           book compiled from narratives.
#   dyerlab-narrative-pdf   the PDF edition of a book (or a standalone narrative).
# No code-tools: students don't need the narrative source. Not self-contained,
# so pages with widgets stay light and media are published under docs/media/.
# Books override anything book-specific (documentclass, numbering, cover) in
# their own _quarto.yml.
contributes:
  formats:
    common:
      highlight-style: arrow
      code-overflow: wrap
      format-links: false
    html:
      theme: [../current-theme.scss, ../dyerlab-html.scss]
      toc: true
      toc-title: Contents
      toc-location: right
      toc-depth: 3
      html-math-method: katex
      code-copy: true
      code-block-border-left: "#5BBCD6"
      citations-hover: true
      footnotes-hover: true
      link-external-icon: true
      embed-resources: false
      code-tools: false
    pdf:
      pdf-engine: xelatex
      fontsize: 11pt
      mainfont: "Helvetica Neue"
      monofont: "Menlo"
      papersize: letter
      geometry:
        - margin=1in
      colorlinks: true
      toc: true
      toc-depth: 2
      fig-pos: "H"
      # Wrap long lines in both code and plain-text output (code-overflow
      # only affects highlighted source in PDF).
      include-in-header:
        text: |
          \usepackage{fvextra}
          \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,breakanywhere,commandchars=\\\{\}}
          \RecustomVerbatimEnvironment{verbatim}{Verbatim}{breaklines,breakanywhere}
